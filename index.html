<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Progression</title>
  <meta name="description" content="Suis tes performances et ta progression sur chaque exercice de musculation.">
  <meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D0F12" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Progression">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a id="back" class="icon-btn" href="#/home" aria-label="Retour" hidden>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
      </a>
      <h1 id="title">Progression</h1>
      <div id="topbar-actions" class="topbar-actions"></div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="timer" class="timer" hidden></div>

  <nav class="tabbar" aria-label="Navigation principale">
    <a class="tab" data-tab="home" href="#/home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Accueil</span>
    </a>
    <a class="tab" data-tab="session" href="#/session">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/></svg>
      <span>Séance</span>
    </a>
    <a class="tab" data-tab="progress" href="#/progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-7"/></svg>
      <span>Progrès</span>
    </a>
    <a class="tab" data-tab="history" href="#/history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>Historique</span>
    </a>
    <a class="tab" data-tab="settings" href="#/settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
      <span>Réglages</span>
    </a>
  </nav>

  <div id="modal-root" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p style="padding:24px">Cette application a besoin de JavaScript pour fonctionner.</p></noscript>

  <script src="js/stats.js"></script>
  <script src="js/store.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
